version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - db_data:/var/lib/postgresql/data

  moodle:
    image: bitnami/moodle:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MOODLE_DATABASE_HOST: db
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodle
      MOODLE_DATABASE_NAME: moodle
      BITNAMI_DEBUG: "true"
    depends_on:
      - db

volumes:
  db_data:

# Notes:
# - After `docker compose up -d` open http://localhost:8080 to finish Moodle setup.
# - Use an admin UI to enable the External tool (LTI) and Gradebook services.
# - Keep credential values here for quick sandboxing only; do not use in production.
