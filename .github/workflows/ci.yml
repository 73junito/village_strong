name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
      strategy:
      fail-fast: false
      matrix:
        python-version: [3.11, 3.12, 3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        working-directory: src
        run: |
          python -m pip install pytest pytest-asyncio coverage pytest-cov

      - name: Run tests (with coverage)
        working-directory: src
        run: |
          python -m pytest --cov=app --cov-report=xml:coverage.xml -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint placeholder
        run: |
          echo "Lint/type-check job placeholder — add flake8/mypy later"
        # keep working-directory stable for future lint commands
        working-directory: src
