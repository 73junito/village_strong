name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio coverage pytest-cov

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src python -m pytest tests \
            --cov=app \
            --cov-report=xml:src/coverage.xml \
            -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: src/coverage.xml
          if-no-files-found: warn

  lint:
    name: Python lint placeholder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint placeholder
        working-directory: src
        run: echo "Lint/type-check job placeholder — add Ruff or mypy later"

  web:
    name: Web build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test rendered output
        run: node --test tests/rendered-html.test.mjs

      # Bundles the Worker and prints the binding table without writing to the
      # Cloudflare API, so config regressions fail here before any deploy.
      - name: Validate Cloudflare deployment bundle
        run: npm run deploy:check

  orchestrator:
    name: Orchestration pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: orchestration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: orchestration/package-lock.json

      - name: Install dependencies
        run: npm ci

      # env.d.ts is generated (and gitignored) from wrangler.jsonc, so it must be
      # rebuilt before typechecking or the Env bindings will not exist at all.
      - name: Generate runtime types
        run: npm run cf:types

      # Three configs, three environments: the Workers runtime, the Node unit
      # tests, and the workerd integration suite. Merging them would merge
      # conflicting global declarations.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (ten gates + approval boundary)
        run: npm run test:unit

      # Boots the Worker on workerd with the Durable Object and Workflow bindings
      # and exercises the full lifecycle: start, park at AWAITING_APPROVAL,
      # approve, release once, reject repeats, and keep concurrent runs isolated.
      - name: Integration tests (workerd)
        run: npm run test:integration

      # Bundles the Worker and prints the binding table. `--dry-run` writes
      # nothing to the Cloudflare API, so this job cannot deploy. The repository
      # also holds no deploy credentials: CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID are intentionally not configured here, and this
      # job never invokes `wrangler deploy` for real.
      #
      # The command names the config explicitly. The former `deploy:dry-run`
      # resolved to wrangler.jsonc by default, which reads as a deploy step in
      # the workflow and invites a reader to "simplify" it into an actual one.
      - name: Validate Cloudflare deployment bundle
        run: npm run check:private-config
