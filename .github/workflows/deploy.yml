name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one deployment at a time; queue rather than cancel in-flight runs.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Builds the vinext bundle and asserts it exports a Worker `fetch`.
      - name: Build and validate artifact
        run: npm run build

      - name: Render smoke test
        run: node --test tests/rendered-html.test.mjs

      - name: Verify bindings without deploying
        run: npm run deploy:check

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        if: always()
        run: echo "Deployed ${{ github.sha }} to Worker village-strong-family-foundation"
