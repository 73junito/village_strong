name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one deployment at a time; queue rather than cancel in-flight runs.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast and loudly. Without these the deploy step fails deep in
      # Wrangler's auth handling, after a full lint/build/test cycle has
      # already run, and the real cause is easy to miss.
      - name: Check required secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is not set. Add it under" \
                "Settings -> Secrets and variables -> Actions -> New repository secret."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Builds the vinext bundle and asserts it exports a Worker `fetch`.
      - name: Build and validate artifact
        run: npm run build

      - name: Render smoke test
        run: node --test tests/rendered-html.test.mjs

      - name: Verify bindings without deploying
        run: npm run deploy:check

      - name: Deploy to Cloudflare
        id: deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Reports the real outcome. A previous version used `if: always()` with a
      # hardcoded success message, so a failed deploy still printed "Deployed".
      - name: Summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "::notice title=Deployed::Worker village-strong-family-foundation" \
              "is live at commit ${GITHUB_SHA}."
            echo "Custom domains (if enabled): villagestrongfoundation.org, www.villagestrongfoundation.org"
          else
            echo "::error title=Deploy failed::Cloudflare did not accept the deployment" \
              "(outcome: ${DEPLOY_OUTCOME}). Production is unchanged."
            echo "The previously deployed Worker version, if any, is still serving traffic."
          fi
